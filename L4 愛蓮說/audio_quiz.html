<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎧 [L04] 有聲測驗卷 ‧ 周敦頤〈愛蓮說〉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --accent-warm: #f59e0b;
      --text-main: #0f172a;
      --bg-page: #f1f5f9;
      --border-card: #cbd5e1;
      
      /* 規範 1: 有聲卷內容與上方列字級宣告 */
      --topbar-font-size: 16pt;
      --audio-content-font-size: 16pt;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Iansui", "芫荽", "ㄅ字嗨注音標楷", "標楷體", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: var(--audio-content-font-size) !important;
      line-height: 1.7;
      padding: 16px 12px 100px 12px;
      position: relative;
    }

    /* ================= 規範 1: 上方功能列 (16pt、可收合) ================= */
    header.top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      max-width: 960px;
      margin: 0 auto 16px auto;
      background: #ffffff;
      border: 2px solid #bae6fd;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: var(--topbar-font-size) !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }
    .top-bar.collapsed { display: none !important; }

    #topBarExpandPill {
      display: none;
      position: fixed;
      top: 10px;
      left: 16px;
      z-index: 1001;
      background: var(--primary);
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 15pt;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    .tool-btn {
      padding: 6px 14px;
      font-size: 14pt;
      font-weight: bold;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .tool-btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .tool-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary-dark); }
    .tool-btn.primary:hover { background: var(--primary-dark); }
    .tool-btn.warm { background: #fef3c7; color: #b45309; border-color: #fde047; }
    .tool-btn.success { background: #dcfce7; color: #15803d; border-color: #86efac; }

    /* 測驗卷本體卡片 */
    .a4-paper {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 36px;
      border-radius: 14px;
      border: 1.5px solid var(--border-card);
      box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    }
    .ws-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2.5px solid #0284c7;
      padding-bottom: 14px;
      margin-bottom: 20px;
      gap: 16px;
    }
    .ws-code-badge {
      background: #0284c7;
      color: #fff;
      font-size: 13.5pt;
      padding: 2px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 900;
    }
    .ws-student-meta {
      display: flex;
      gap: 16px;
      font-size: 15pt;
      color: #334155;
      margin-top: 6px;
      font-weight: bold;
    }
    .meta-box {
      border-bottom: 2px solid #64748b;
      padding: 0 10px;
      min-width: 70px;
      text-align: center;
      color: #0284c7;
    }

    .q-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      transition: border 0.15s;
    }
    .q-stem-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .opt-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (max-width: 650px) {
      .opt-container { grid-template-columns: 1fr; }
    }
    .opt-item {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15.5pt;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .opt-item:hover { background: #f1f5f9; border-color: #94a3b8; }
    .opt-item.selected { background: #e0f2fe; border-color: #0284c7; color: #0369a1; font-weight: bold; }

    /* 老師解答模式標籤 */
    .teacher-sol-banner { display: none !important; margin-top: 10px; padding: 10px 14px; background: #fef3c7; color: #92400e; border-radius: 8px; font-size: 15pt; border-left: 4px solid #f59e0b; }
    body.is-teacher .teacher-sol-banner { display: block !important; }
    body.is-teacher .opt-item.is-correct { border: 2.5px solid #10b981 !important; background: #dcfce7 !important; color: #15803d !important; font-weight: bold; }

    /* ================= 規範 2: 畫面右側常置工具列 ================= */
    .floating-sidebar-toolbar {
      position: fixed;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 99999;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 26px rgba(2, 132, 199, 0.22);
      width: 64px;
      align-items: center;
    }
    .sidebar-tool-btn {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 1.5px solid #bae6fd;
      background: #f0f9ff;
      color: #0369a1;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .sidebar-tool-btn:hover { background: #0284c7; color: #fff; transform: scale(1.1); }

    .color-picker-palette {
      display: none;
      position: fixed;
      right: 80px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100000;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      flex-direction: column;
      gap: 8px;
    }
    .palette-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      font-size: 14pt;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
    }
    .palette-btn.red { background: #ef4444; }
    .palette-btn.blue { background: #2563eb; }
    .palette-btn.green { background: #10b981; }

    #paintCanvasOverlay { display: none; position: fixed; inset: 0; z-index: 99998; cursor: crosshair; }
    .paint-controls-bar {
      display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 99999; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 12px;
      color: #fff; font-size: 14pt;
    }

    .magnifier-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px); z-index: 100001; align-items: center; justify-content: center;
    }
    .magnifier-box {
      background: #ffffff; border-radius: 16px; padding: 30px; max-width: 650px; width: 90%;
      border: 3px solid #38bdf8; box-shadow: 0 12px 36px rgba(0,0,0,0.3); text-align: center;
    }
    .magnified-text { font-size: 32pt; font-weight: 900; color: #0369a1; padding: 16px; background: #f0f9ff; border-radius: 12px; }

    /* 身分認證 Modal */
    .identity-modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 100002;
    }
    .identity-modal-box {
      background: #ffffff; border-radius: 18px; padding: 30px 36px; max-width: 480px; width: 92%;
      border: 2px solid #38bdf8; box-shadow: 0 12px 36px rgba(0,0,0,0.3); text-align: center;
    }
    .identity-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
    .identity-btn {
      padding: 12px; font-size: 16pt; font-weight: bold; border-radius: 10px;
      border: 2px solid #cbd5e1; background: #f8fafc; color: #1e293b; cursor: pointer;
    }
    .identity-btn:hover { border-color: #0284c7; background: #f0f9ff; }
    .identity-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .teacher-identity-btn { grid-column: span 3; background: #eff6ff; color: #1d4ed8; }

    /* 評量結果面板 (比照 deploy_web 設計) */
    .result-panel-box {
      display: none; background: #ffffff; border: 2.5px solid #38bdf8; border-radius: 16px;
      padding: 26px; margin-top: 24px; box-shadow: 0 8px 30px rgba(2, 132, 199, 0.15);
    }
    .stat-tri-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 18px 0; }
    .stat-card { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px; text-align: center; }
    .stat-card.primary { background: #f0f9ff; border-color: #bae6fd; }
    .stat-card.success { background: #f0fdf4; border-color: #bbf7d0; }
    .stat-val { font-size: 26pt; font-weight: 900; margin-top: 4px; }
    .stat-card.primary .stat-val { color: #0284c7; }
    .stat-card.success .stat-val { color: #16a34a; }

    .result-actions-row { display: flex; justify-content: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
    .res-action-btn {
      padding: 12px 24px; border-radius: 10px; font-size: 16pt; font-weight: bold; cursor: pointer;
      border: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .res-action-btn.retry { background: #fef3c7; color: #b45309; }
    .res-action-btn.review { background: #e0f2fe; color: #0369a1; }
    .res-action-btn.next { background: #10b981; color: #ffffff; }

    .submit-success-badge {
      display: none; background: #ecfdf5; border: 1.5px solid #a7f3d0; color: #065f46;
      padding: 12px 20px; border-radius: 10px; font-size: 16pt; font-weight: bold; text-align: center; margin-top: 16px;
    }

    /* 特教輔助層級按鈕樣式 */
    .prompt-level-btn {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14pt;
      font-weight: bold;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      font-family: inherit;
    }
    .prompt-level-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .prompt-level-btn.active {
      border-color: #0284c7;
      background: #e0f2fe;
      color: #0369a1;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    mark.user-highlight { background-color: #fef08a; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- 頂部展開膠囊 -->
  <button id="topBarExpandPill" onclick="toggleTopBarCollapse()">🔽 展開功能列</button>

  <!-- 規範 1: 上方功能列 (16pt、可收合) -->
  <header class="top-bar" id="mainTopBar">
    <div style="display:flex; align-items:center; gap:10px;">
      <a href="./index.html" class="tool-btn">🔙 返回電子書</a>
      <span style="font-weight:900; color:#0369a1; font-size:16pt;">🎧 有聲練習卷 ‧ 周敦頤〈愛蓮說〉</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="tool-btn" onclick="openIdentityModal()" id="btnCurIdentity">
        👤 座號：01號 [切換]
      </button>
      <button class="tool-btn success" onclick="window.print()">🖨️ 列印考卷</button>
      <button class="tool-btn" onclick="toggleTopBarCollapse()">🔼 收合功能列</button>
    </div>
  </header>

  <!-- 規範 2: 畫面右側常置工具列 -->
  <aside class="floating-sidebar-toolbar">
    <button class="sidebar-tool-btn" onclick="triggerTTS()" title="🔊 朗讀反白文字">🔊</button>
    <button class="sidebar-tool-btn" onclick="toggleCanvasPen()" title="✏️ 畫筆塗鴉" id="sidebarPenBtn">✏️</button>
    <button class="sidebar-tool-btn" onclick="triggerHighlight()" title="🖍️ 螢光筆圈記">🖍️</button>
    <button class="sidebar-tool-btn" onclick="triggerMagnifier()" title="🔍 放大鏡檢視">🔍</button>
    <button class="sidebar-tool-btn" onclick="toggleColorPicker()" title="🎨 反白後變色">🎨</button>
    <button class="sidebar-tool-btn" onclick="clearAllMarks()" title="🧹 清除標記">🧹</button>
  </aside>

  <!-- 反白後變色調色盤 -->
  <div class="color-picker-palette" id="colorPalette">
    <div style="font-size:12pt; font-weight:bold; color:#475569; margin-bottom:2px;">請選擇顏色：</div>
    <button class="palette-btn red" onclick="applyTextColor('#ef4444')">🔴 紅色字</button>
    <button class="palette-btn blue" onclick="applyTextColor('#2563eb')">🔵 藍色字</button>
    <button class="palette-btn green" onclick="applyTextColor('#16a34a')">🟢 綠色字</button>
  </div>

  <!-- 全螢幕畫筆 Canvas -->
  <canvas id="paintCanvasOverlay"></canvas>
  <div class="paint-controls-bar" id="paintControlsBar" style="display:none;">
    <span>✏️ 塗鴉畫筆中</span>
    <button class="tool-btn primary" onclick="setPenColor('#ef4444')">紅筆</button>
    <button class="tool-btn" onclick="setPenColor('#0284c7')">藍筆</button>
    <button class="tool-btn" onclick="setPenColor('#f59e0b')">黃筆</button>
    <button class="tool-btn" onclick="clearCanvas()">清除筆跡</button>
    <button class="tool-btn" onclick="toggleCanvasPen()">關閉畫筆</button>
  </div>

  <!-- 放大鏡視窗 Modal -->
  <div class="magnifier-modal-overlay" id="magnifierModal">
    <div class="magnifier-box">
      <div style="font-size:28px;">🔍 反白文字放大鏡</div>
      <div class="magnified-text" id="magnifiedContent">請先選取文字</div>
      <button class="tool-btn primary" onclick="closeMagnifier()" style="font-size:16pt; padding:8px 24px;">關閉</button>
    </div>
  </div>

  <!-- 身分確認 Modal (老師 + 01~06 學生) -->
  <div class="identity-modal-overlay" id="identityModal">
    <div class="identity-modal-box">
      <div style="font-size:38px;">👋</div>
      <h3 style="font-size:20pt; font-weight:900; color:#0369a1; margin-bottom:6px;">請確認作答座號</h3>
      <div class="identity-grid">
        <button class="identity-btn active" onclick="selectSeat('01', this)">01 號</button>
        <button class="identity-btn" onclick="selectSeat('02', this)">02 號</button>
        <button class="identity-btn" onclick="selectSeat('03', this)">03 號</button>
        <button class="identity-btn" onclick="selectSeat('04', this)">04 號</button>
        <button class="identity-btn" onclick="selectSeat('05', this)">05 號</button>
        <button class="identity-btn" onclick="selectSeat('06', this)">06 號</button>
        <button class="identity-btn teacher-identity-btn" onclick="selectSeat('test.', this)">👨‍🏫 老師模式</button>
      </div>
      <button class="tool-btn primary" style="width:100%; justify-content:center; padding:12px; font-size:16pt;" onclick="confirmIdentityModal()">
        🚀 確認座號，開始測驗！
      </button>
    </div>
  </div>

  <!-- 試卷主容器 -->
  <div class="a4-paper">
    <header class="ws-header">
      <div>
        <div style="font-size:14pt; color:#64748b; font-weight:bold;">國語文領域 課堂學習評量卷</div>
        <h1 style="font-size:20pt; font-weight:900; color:#0369a1; margin:4px 0;">
          <span class="ws-code-badge">L04-QUIZ</span> <span>第 4 課 周敦頤〈愛蓮說〉綜合會考有聲練習卷</span>
        </h1>
        <div class="ws-student-meta">
          <span>年級班級：八年____班</span>
          <span>座號：<span class="meta-box" id="dispSeatNumber">01</span></span>
          <span>姓名：<span class="meta-box">＿＿＿＿</span></span>
          <span>得分：<span class="meta-box" id="dispTotalScore">＿＿</span></span>
        </div>
      </div>
    </header>

    <!-- 10 題題目容器 -->
    <div id="audioQuizContainer"></div>

    <!-- 送出檢核按鈕 (全做完才解鎖) -->
    <div style="text-align:center; margin-top:24px;">
      <button class="tool-btn primary" id="btnSubmitAudioQuiz" onclick="submitAudioAssessment()" style="padding:12px 36px; font-size:18pt;">
        📊 完成作答，檢核本次成果！
      </button>
    </div>

    <!-- 規範 7 & 8: 評量結果面板 -->
    <div class="result-panel-box" id="resultPanelBox">
      <div style="text-align:center;">
        <div style="font-size:36px;">🎉</div>
        <h3 style="font-size:22pt; font-weight:900; color:#0369a1; margin-bottom:4px;">
          本次有聲測驗結算
        </h3>
        <p style="font-size:15pt; color:#64748b;">作答座號：<span id="resSeatLabel" style="font-weight:bold; color:#0284c7;">01</span> 號</p>
      </div>

      <!-- 三宮格數據 -->
      <div class="stat-tri-grid">
        <div class="stat-card primary">
          <div style="font-size:15pt; color:#64748b;">測驗正確率</div>
          <div class="stat-val" id="resAccuracy">0%</div>
        </div>
        <div class="stat-card success">
          <div style="font-size:15pt; color:#64748b;">答對題數 / 總分</div>
          <div class="stat-val" id="resScore">0 / 10 題</div>
        </div>
        <div class="stat-card">
          <div style="font-size:15pt; color:#64748b;">作答耗時</div>
          <div class="stat-val" id="resDuration" style="color:#475569;">00:00</div>
        </div>
      </div>

      <!-- 答題細部檢視 -->
      <div id="resDetailList" style="margin-top:16px;"></div>

      <!-- 方案 C: 特教輔助層級（IEP標準 4 級標籤，支援 B+C 自動研判與手動微調） -->
      <div class="prompt-level-section" style="background:#f8fafc; border:1.5px solid #cbd5e1; border-radius:12px; padding:16px; margin:18px 0; text-align:left;">
        <div style="font-size:16pt; font-weight:bold; color:#0369a1; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <span>🏷️ 特教輔助層級（IEP標準評量等級）：</span>
          <span id="promptLevelHint" style="font-size:13pt; color:#64748b; font-weight:normal;"></span>
        </div>
        <div class="prompt-level-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px;">
          <button type="button" class="prompt-level-btn" id="btnLevel-independent" onclick="selectPromptLevel('自主完成')">
            🟢 自主完成（獨立作答）
          </button>
          <button type="button" class="prompt-level-btn" id="btnLevel-verbal" onclick="selectPromptLevel('口語提示')">
            🟡 口語提示（教師引導）
          </button>
          <button type="button" class="prompt-level-btn" id="btnLevel-visual" onclick="selectPromptLevel('視覺提示')">
            🟠 視覺提示（查閱提示卡）
          </button>
          <button type="button" class="prompt-level-btn" id="btnLevel-physical" onclick="selectPromptLevel('肢體協助')">
            🔴 肢體協助（動作指引）
          </button>
        </div>
      </div>

      <!-- 規範 9: 三大按鈕連動自動送出 Google 表格 -->
      <div class="result-actions-row">
        <button class="res-action-btn retry" onclick="triggerActionRetry()">🔄 再次作答</button>
        <button class="res-action-btn review" onclick="triggerActionReview()">📖 到上方學習區複習</button>
        <button class="res-action-btn next" onclick="triggerActionNext()">⏭️ 進到下一關</button>
      </div>

      <!-- 規範 9: 勾選標籤表示本次成績已送出 -->
      <div class="submit-success-badge" id="submitSuccessBadge">

    window.addEventListener('DOMContentLoaded', () => {
      initIdentityDisplay();
      renderQuiz();
      initSpeech();
      initPaintCanvas();
    });

    function toggleTopBarCollapse() {
      const topBar = document.getElementById('mainTopBar');
      const expandPill = document.getElementById('topBarExpandPill');
      if (!topBar) return;
      const isCollapsed = topBar.classList.contains('collapsed');
      if (isCollapsed) {
        topBar.classList.remove('collapsed');
        if (expandPill) expandPill.style.display = 'none';
      } else {
        topBar.classList.add('collapsed');
        if (expandPill) expandPill.style.display = 'inline-block';
      }
    }

    function openIdentityModal() { document.getElementById('identityModal').style.display = 'flex'; }
    function closeIdentityModal() { document.getElementById('identityModal').style.display = 'none'; }
    function selectSeat(seat, btn) {
      currentUserSeat = seat;
      document.querySelectorAll('.identity-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
    function confirmIdentityModal() {
      localStorage.setItem('l4_user_seat', currentUserSeat);
      isTeacher = (currentUserSeat === 'test.');
      initIdentityDisplay();
      closeIdentityModal();
      speakText('已確認為' + (isTeacher ? '老師模式' : currentUserSeat + '號') + '，請開始作答！');
    }
    function initIdentityDisplay() {
      isTeacher = (currentUserSeat === 'test.');
      document.body.classList.toggle('is-teacher', isTeacher);
      const label = document.getElementById('btnCurIdentity');
      if (label) label.innerText = isTeacher ? '👨‍🏫 老師模式 [切換]' : `👤 座號：${currentUserSeat}號 [切換]`;
      const disp = document.getElementById('dispSeatNumber');
      if (disp) disp.innerText = isTeacher ? '測試' : currentUserSeat;
    }

    function initSpeech() { if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => {}; }
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const pronounceable = String(text).replace(/噫/g, '意');
      const u = new SpeechSynthesisUtterance(pronounceable);
      u.lang = 'zh-TW'; u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    const hintedQuestions = new Set();
    let currentSelectedLevel = '自主完成';
    let currentLevelDetail = '';

    function toggleQuizHint(qid, btn) {
      const hintCard = document.getElementById('quizHint-' + qid);
      if (!hintCard) return;
      if (hintCard.style.display === 'none' || hintCard.style.display === '') {
        hintCard.style.display = 'block';
        hintedQuestions.add(qid);
        btn.style.background = '#fde047';
        btn.innerText = '💡 隱藏提示';
        const qObj = QUIZ_DATA.find(x => x.id === qid);
        if (qObj) speakText('提示導引：' + qObj.hint);
      } else {
        hintCard.style.display = 'none';
        btn.style.background = '#fef9c3';
        btn.innerText = '💡 提示';
      }
    }

    function selectPromptLevel(level, detail = '') {
      currentSelectedLevel = level;
      if (detail) currentLevelDetail = detail;

      const btnMap = {
        '自主完成': 'btnLevel-independent',
        '口語提示': 'btnLevel-verbal',
        '視覺提示': 'btnLevel-visual',
        '肢體協助': 'btnLevel-physical'
      };

      document.querySelectorAll('.prompt-level-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(btnMap[level]);
      if (activeBtn) activeBtn.classList.add('active');

      const hintLabel = document.getElementById('promptLevelHint');
      if (hintLabel) {
        if (level === '視覺提示' && currentLevelDetail) {
          hintLabel.innerText = `（系統依據作答紀錄：${currentLevelDetail}）`;
        } else {
          hintLabel.innerText = `（當前已選定：${level}）`;
        }
      }

      if (lastCalculatedResult) {
        const fullModeStr = (level === '視覺提示' && currentLevelDetail) 
          ? `${level}${currentLevelDetail}` 
          : level;
        lastCalculatedResult.completionMode = fullModeStr;
      }
    }

    function renderQuiz() {
      const container = document.getElementById('audioQuizContainer');
      let html = '';
      QUIZ_DATA.forEach((q, idx) => {
        if (q.section) {
          html += `
            <div style="background:linear-gradient(90deg, #0284c7, #0369a1); color:#ffffff; padding:10px 18px; border-radius:10px; font-weight:900; font-size:16.5pt; margin:18px 0 12px 0;">
              📌 ${q.section}
            </div>
          `;
        }
        let optHtml = '';
        q.opts.forEach((opt, oIdx) => {
          optHtml += `
            <div class="opt-item ${oIdx === q.ans ? 'is-correct' : ''}" data-qid="${q.id}" data-val="${oIdx}" onclick="chooseOption('${q.id}', ${oIdx}, this)">
              <span>(${letters[oIdx]}) ${opt}</span>
              <button class="tool-btn" onclick="event.stopPropagation(); speakText('選項${letters[oIdx]}：${opt}')" style="padding:2px 8px; font-size:12pt;">🔊</button>
            </div>
          `;
        });
        html += `
          <div class="q-item" id="qItem-${q.id}">
            <div class="q-stem-row" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <span style="font-size:16pt; font-weight:bold; color:#0f172a;">${q.q}</span>
              <div style="display:flex; gap:6px;">
                <button class="tool-btn" onclick="toggleQuizHint('${q.id}', this)" style="padding:3px 10px; font-size:13pt; background:#fef9c3; color:#854d0e; border-color:#fde047;">💡 提示</button>
                <button class="tool-btn" onclick="speakText('${q.q}')" style="padding:3px 10px; font-size:13pt;">🔊 朗讀題幹</button>
              </div>
            </div>
            <!-- 方案 B: 題目專屬思路導引卡片 (點擊就地展開) -->
            <div class="quiz-hint-card" id="quizHint-${q.id}" style="display:none; background:#fefce8; border:1.5px dashed #facc15; border-radius:8px; padding:10px 14px; margin:8px 0 12px 0; font-size:15pt; color:#854d0e;">
              💡 <strong>解題導引：</strong>${q.hint}
            </div>
            <div class="opt-container">${optHtml}</div>
            <div class="teacher-sol-banner" id="sol-${q.id}">
              <strong>【正解說明】：</strong>(${letters[q.ans]}) ${q.opts[q.ans]}<br>
              <small>💡 解析：${q.hint}</small>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function chooseOption(qid, optIdx, el) {
      userAnswers[qid] = optIdx;
      const card = document.getElementById('qItem-' + qid);
      if (card) {
        card.querySelectorAll('.opt-item').forEach(b => b.classList.remove('selected'));
      }
      el.classList.add('selected');
    }

    function submitAudioAssessment() {
      const unanswered = [];
      QUIZ_DATA.forEach((q, idx) => {
        if (userAnswers[q.id] === undefined) unanswered.push(idx + 1);
      });
      if (unanswered.length > 0) {
        alert(`⚠️ 還有題目尚未作答完成：第 ${unanswered.join('、')} 題\n請完成所有題目後再點擊檢核！`);
        return;
      }

      let correctCount = 0;
      const reviewDetails = [];
      const wrongIndices = [];

      QUIZ_DATA.forEach((q, idx) => {
        const userChoice = userAnswers[q.id];
        const isRight = (userChoice === q.ans);
        if (isRight) {
          correctCount++;
        } else {
          wrongIndices.push(idx + 1);
        }
        reviewDetails.push({
          qNum: idx + 1,
          stem: q.q,
          userChoice: letters[userChoice],
          correctChoice: letters[q.ans],
          isRight: isRight
        });
      });

      const total = QUIZ_DATA.length;
      const accuracy = Math.round((correctCount / total) * 100);
      const score = accuracy;
      const durationSeconds = Math.round((Date.now() - quizStartTime) / 1000);
      const durationStr = `${Math.floor(durationSeconds/60)}分${durationSeconds%60}秒`;

      document.getElementById('dispTotalScore').innerText = score;
      document.getElementById('resSeatLabel').innerText = (currentUserSeat === 'test.') ? '老師測試' : currentUserSeat;
      document.getElementById('resAccuracy').innerText = accuracy + '%';
      document.getElementById('resScore').innerText = `${correctCount} / ${total} 題 (${score}分)`;
      document.getElementById('resDuration').innerText = durationStr;

      const detailBox = document.getElementById('resDetailList');
      let detailHtml = '';
      if (wrongIndices.length > 0) {
        detailHtml += `
          <div style="background:#fef2f2; border:1px solid #fecaca; border-radius:8px; padding:12px; margin-bottom:14px; color:#b91c1c; font-size:15pt; font-weight:bold;">
            ⚠️ 需要訂正題號：第 ${wrongIndices.join('、')} 題
          </div>
        `;
      } else {
        detailHtml += `
          <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:12px; margin-bottom:14px; color:#15803d; font-size:15pt; font-weight:bold;">
            🎉 恭喜滿分 100%！全數答對！
          </div>
        `;
      }

      reviewDetails.forEach(d => {
        detailHtml += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid #e2e8f0; font-size:15pt; flex-wrap:wrap; gap:8px;">
            <div>
              <span>${d.isRight ? '✅' : '❌'}</span>
              <strong>第 ${d.qNum} 題</strong>
            </div>
            <div style="font-size:14pt;">
              學生回答：<strong style="color:${d.isRight ? '#15803d' : '#dc2626'};">(${d.userChoice})</strong>
              ${!d.isRight ? ` ｜ 正解：<strong style="color:#15803d;">(${d.correctChoice})</strong>` : ''}
            </div>
          </div>
        `;
      });
      detailBox.innerHTML = detailHtml;

      // 方案 B+C 連動研判
      let autoLevel = '自主完成';
      let autoDetail = '';
      if (hintedQuestions.size > 0) {
        autoLevel = '視覺提示';
        const qNums = [];
        QUIZ_DATA.forEach((q, idx) => {
          if (hintedQuestions.has(q.id)) {
            qNums.push(`第${idx + 1}題`);
          }
        });
        autoDetail = `(查閱 ${qNums.join('、')} 提示)`;
      }

      currentSelectedLevel = autoLevel;
      currentLevelDetail = autoDetail;
      const fullCompletionMode = autoDetail ? `${autoLevel} ${autoDetail}` : autoLevel;

      lastCalculatedResult = {
        seat: currentUserSeat,
        score: score,
        totalQuestions: total,
        correctCount: correctCount,
        accuracy: accuracy,
        durationSeconds: durationSeconds,
        attemptCount: `第 ${attemptCount} 次`,
        completionMode: fullCompletionMode,
        userAnswers: userAnswers,
        moduleTitle: '第4課 愛蓮說 有聲練習卷(5+5素養題)'
      };

      // 預選特教輔助層級
      selectPromptLevel(autoLevel, autoDetail);

      document.getElementById('resultPanelBox').style.display = 'block';
      document.getElementById('resultPanelBox').scrollIntoView({ behavior: 'smooth' });

      if (wrongIndices.length === 0) {
        speakText('測驗完成，恭喜全部答對！');
      } else {
        speakText(`本次答對 ${correctCount} 題，有 ${wrongIndices.length} 題需要訂正喔！`);
      }
    }

    function sendRecordToGoogleSheet() {
      if (!lastCalculatedResult) return;
      if (scoreSubmitted) return;

      const nowIso = new Date().toISOString();
      const seatStr = (lastCalculatedResult.seat === 'test.') ? '老師測試' : lastCalculatedResult.seat;
      const ansDetailStr = Object.entries(lastCalculatedResult.userAnswers || {})
        .map(([k, v]) => `${k}:${letters[v] !== undefined ? letters[v] : v}`)
        .join('; ');

      const legacyPayload = {
        timestamp: nowIso,
        seat: seatStr,
        studentSeat: seatStr,
        attemptCount: lastCalculatedResult.attemptCount,
        score: lastCalculatedResult.score,
        totalQuestions: lastCalculatedResult.totalQuestions,
        correctCount: lastCalculatedResult.correctCount,
        accuracy: lastCalculatedResult.accuracy + '%',
        durationSeconds: lastCalculatedResult.durationSeconds,
        completionMode: lastCalculatedResult.completionMode,
        moduleTitle: lastCalculatedResult.moduleTitle,
        answerDetails: ansDetailStr,
        userAnswers: lastCalculatedResult.userAnswers
      };

      const centralPayload = {
        action: 'recordQuizScore',
        lesson: '115上 第4課 愛蓮說',
        moduleTitle: lastCalculatedResult.moduleTitle,
        seat: seatStr,
        score: lastCalculatedResult.score,
        accuracy: lastCalculatedResult.accuracy,
        correctCount: lastCalculatedResult.correctCount,
        totalQuestions: lastCalculatedResult.totalQuestions,
        durationSeconds: lastCalculatedResult.durationSeconds,
        attemptCount: lastCalculatedResult.attemptCount,
        completionMode: lastCalculatedResult.completionMode,
        answerDetails: ansDetailStr,
        timestamp: nowIso
      };

      fetch(activeWebhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(legacyPayload)
      }).catch(err => console.log('Legacy Sync err:', err));

      fetch(MANAGEMENT_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(centralPayload)
      }).catch(err => console.log('Central Sync err:', err));

      scoreSubmitted = true;
      attemptCount++;
      localStorage.setItem('l4_attempt_count', attemptCount);

      const badge = document.getElementById('submitSuccessBadge');
      document.getElementById('badgeSeat').innerText = seatStr;
      document.getElementById('badgeAcc').innerText = lastCalculatedResult.accuracy + '% ｜ ' + lastCalculatedResult.completionMode;
      if (badge) badge.style.display = 'block';
    }

    function triggerActionRetry() {
      sendRecordToGoogleSheet();
      userAnswers = {};
      hintedQuestions.clear();
      document.querySelectorAll('.quiz-hint-card').forEach(c => c.style.display = 'none');
      document.querySelectorAll('.q-item .tool-btn').forEach(b => {
        if (b.innerText === '💡 隱藏提示') {
          b.innerText = '💡 提示';
          b.style.background = '#fef9c3';
        }
      });
      scoreSubmitted = false;
      quizStartTime = Date.now();
      document.querySelectorAll('.opt-item').forEach(b => b.classList.remove('selected'));
      document.getElementById('resultPanelBox').style.display = 'none';
      const badge = document.getElementById('submitSuccessBadge');
      if (badge) badge.style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      alert('🔄 已為您重置題目與提示紀錄，請重新作答！成績已自動備份記錄。');
    }

    function triggerActionReview() {
      sendRecordToGoogleSheet();
      alert('📖 已送出成績！正在為您返回電子書學習區...');
      location.href = './index.html#tab-study';
    }

    function triggerActionNext() {
      sendRecordToGoogleSheet();
      alert('⏭️ 本卷成績已成功送出！將為您開啟隨堂學習單！');
      location.href = './classroom_worksheet.html';
    }

    // 右側常置工具列邏輯
    function getSelectedText() {
      const sel = window.getSelection();
      return sel ? sel.toString().trim() : '';
    }
    function triggerTTS() {
      const txt = getSelectedText();
      speakText(txt || '請先在試卷中反白選取文字！');
    }
    function triggerHighlight() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.toString().trim() === '') {
        alert('請先反白選取文字！');
        return;
      }
      const range = sel.getRangeAt(0);
      const mark = document.createElement('mark');
      mark.className = 'user-highlight';
      try { range.surroundContents(mark); } catch(e) { alert('請在單一段落內選取文字！'); }
    }
    function triggerMagnifier() {
      const txt = getSelectedText();
      document.getElementById('magnifiedContent').innerText = txt || '請先選取文字！';
      document.getElementById('magnifierModal').style.display = 'flex';
    }
    function closeMagnifier() { document.getElementById('magnifierModal').style.display = 'none'; }
    function toggleColorPicker() {
      const p = document.getElementById('colorPalette');
      p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    }
    function applyTextColor(col) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.toString().trim() === '') {
        alert('請先反白選取文字！');
        return;
      }
      const range = sel.getRangeAt(0);
      const span = document.createElement('span');
      span.style.color = col;
      span.style.fontWeight = 'bold';
      span.className = 'user-colored-text';
      try { range.surroundContents(span); } catch(e) { alert('請在單一段落內選取文字！'); }
      document.getElementById('colorPalette').style.display = 'none';
    }

    let canvasPenActive = false;
    let canvasCtx = null;
    let isDrawing = false;
    let penColor = '#ef4444';

    function initPaintCanvas() {
      const cvs = document.getElementById('paintCanvasOverlay');
      cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      canvasCtx = cvs.getContext('2d');
      canvasCtx.lineWidth = 4; canvasCtx.lineCap = 'round';
      window.addEventListener('resize', () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; });
      cvs.addEventListener('mousedown', (e) => { if(!canvasPenActive) return; isDrawing = true; canvasCtx.strokeStyle = penColor; canvasCtx.beginPath(); canvasCtx.moveTo(e.clientX, e.clientY); });
      cvs.addEventListener('mousemove', (e) => { if(!isDrawing || !canvasPenActive) return; canvasCtx.lineTo(e.clientX, e.clientY); canvasCtx.stroke(); });
      cvs.addEventListener('mouseup', () => isDrawing = false);
    }
    function toggleCanvasPen() {
      canvasPenActive = !canvasPenActive;
      document.getElementById('paintCanvasOverlay').style.display = canvasPenActive ? 'block' : 'none';
      document.getElementById('paintControlsBar').style.display = canvasPenActive ? 'flex' : 'none';
    }
    function setPenColor(c) { penColor = c; }
    function clearCanvas() { if (canvasCtx) canvasCtx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
    function clearAllMarks() {
      clearCanvas();
      document.querySelectorAll('mark.user-highlight').forEach(el => { const p = el.parentNode; while(el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); });
      document.querySelectorAll('.user-colored-text').forEach(el => { const p = el.parentNode; while(el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); });
      alert('🧹 已清除全頁標記與筆跡！');
    }
  </script>
